<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="./index.css" />
        <title>Layered Image Hover Effects</title>
    </head>
    <body>
        <div class="container">
            <div class="imgBx">
                <img src="./image_1.jpg" alt="image_1" style="--i: 2; --j: 0" />
                <img src="./image_1.jpg" alt="image_1" style="--i: 1; --j: 1" />
                <img src="./image_1.jpg" alt="image_1" style="--i: 0; --j: 2" />
                <img
                    src="./image_1.jpg"
                    alt="image_1"
                    style="--i: -1; --j: 3"
                />
                <img
                    src="./image_1.jpg"
                    alt="image_1"
                    style="--i: -2; --j: 4"
                />
            </div>
            <div class="imgBx">
                <img src="./image_2.jpg" alt="image_2" style="--i: 2; --j: 0" />
                <img src="./image_2.jpg" alt="image_2" style="--i: 1; --j: 1" />
                <img src="./image_2.jpg" alt="image_2" style="--i: 0; --j: 2" />
                <img
                    src="./image_2.jpg"
                    alt="image_2"
                    style="--i: -1; --j: 3"
                />
                <img
                    src="./image_2.jpg"
                    alt="image_2"
                    style="--i: -2; --j: 4"
                />
            </div>
            <div class="imgBx">
                <img src="./image_3.jpg" alt="image_3" style="--i: 2; --j: 0" />
                <img src="./image_3.jpg" alt="image_3" style="--i: 1; --j: 1" />
                <img src="./image_3.jpg" alt="image_3" style="--i: 0; --j: 2" />
                <img
                    src="./image_3.jpg"
                    alt="image_3"
                    style="--i: -1; --j: 3"
                />
                <img
                    src="./image_3.jpg"
                    alt="image_3"
                    style="--i: -2; --j: 4"
                />
            </div>
        </div>
    </body>
</html>
