<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="./index.css" />
        <title>Animation Effect + 360 degree</title>
        <script>
            let box;
            let isDragging = false;
            let previousX, previousY;
            let rotateX = -30;
            let rotateY = 0;
            let velocityX = 0;
            let velocityY = 0;
            let inertiaFrame;

            document.addEventListener("DOMContentLoaded", () => {
                box = document.querySelector(".box");

                box.style.cursor = "grab";

                box.addEventListener("mousedown", (e) => {
                    isDragging = true;
                    previousX = e.clientX;
                    previousY = e.clientY;
                    cancelAnimationFrame(inertiaFrame); // 停止慣性動畫
                    box.style.cursor = "grabbing";
                });

                window.addEventListener("mousemove", (e) => {
                    if (!isDragging) return;

                    const deltaX = e.clientX - previousX;
                    const deltaY = e.clientY - previousY;

                    rotateY += deltaX * 0.5;
                    rotateX -= deltaY * 0.5;

                    // 記錄速度（用於慣性）
                    velocityX = deltaX * 0.3;
                    velocityY = deltaY * 0.3;

                    applyRotation();
                    previousX = e.clientX;
                    previousY = e.clientY;
                });

                window.addEventListener("mouseup", () => {
                    if (!isDragging) return;
                    isDragging = false;
                    box.style.cursor = "grab";
                    startInertia();
                });
            });

            function applyRotation() {
                box.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
            }

            function startInertia() {
                // 慣性衰減因子（越小越快停）
                const damping = 0.8;

                function animate() {
                    rotateY += velocityX;
                    rotateX -= velocityY;

                    applyRotation();

                    velocityX *= damping;
                    velocityY *= damping;

                    // 速度變小到幾乎靜止時結束
                    if (
                        Math.abs(velocityX) < 0.05 &&
                        Math.abs(velocityY) < 0.05
                    )
                        return;
                    inertiaFrame = requestAnimationFrame(animate);
                }

                inertiaFrame = requestAnimationFrame(animate);
            }
        </script>
    </head>
    <body>
        <div class="box">
            <div class="top"></div>
            <div class="bottom"></div>
            <div>
                <span></span>
                <span><i class="tape"></i></span>
                <span></span>
                <span><i class="tape"></i></span>
            </div>
        </div>
    </body>
</html>
